name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Bundling catches broken imports and Metro resolution errors that tsc does not.
      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist/android

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir dist/ios

      # Reports dependency/config issues without failing the build.
      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true
